# Render Blueprint: one Web Service that runs the API and also serves the site (web/).
# Deploy: push the repo to GitHub, then Render dashboard -> New -> Blueprint -> pick the repo.
# Variables marked sync:false are prompted for in the dashboard (never stored in git).
services:
  - type: web
    name: vuta
    runtime: node
    plan: free
    region: frankfurt            # closest to Kenya; change if your Supabase region is elsewhere
    # No rootDir on purpose: the server serves ../web, so the whole repo must be present.
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SERVE_WEB
        value: "true"
      # Set both to your Render URL, e.g. https://vuta.onrender.com (no trailing slash)
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Paystack (start with sk_test_...)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: KES
      # APIShort (catalogue + playback). Key goes in SYLN_API_TOKEN (name kept from the first version).
      - key: SYLN_BASE_URL
        value: https://apishort.com
      - key: SYLN_API_TOKEN
        sync: false
      - key: SYLN_AUTH_HEADER
        value: X-API-Key
      - key: SYLN_AUTH_SCHEME
        value: ""
      - key: SYLN_DEFAULT_PLATFORM
        value: shortmax
      - key: SYLN_LANG
        value: id                # check /languages; change to en if supported
      - key: SYLN_REQUESTS_PER_SECOND
        value: "2"
      - key: SYLN_DAILY_BUDGET
        value: "90"              # free plan = 100 requests/day
      - key: SYLN_PATH_PING
        value: /v1/{platform}/api/v1/languages
      - key: SYLN_PATH_PLATFORMS
        value: ""
      - key: SYLN_PATH_CATALOG
        value: /v1/{platform}/api/v1/popular
      - key: SYLN_PATH_SEARCH
        value: /v1/{platform}/api/v1/search
      - key: SYLN_PATH_FILM
        value: /v1/{platform}/api/v1/detail/{id}
      - key: SYLN_PATH_EPISODES
        value: /v1/{platform}/api/v1/alleps/{id}
      - key: SYLN_FIELD_MAP
        value: '{"film":{"id":["code"],"episodeCount":["episodes"],"genres":["tags"]}}'
      - key: SYLN_QUALITY
        value: "720"             # 480 / 720 / 1080
      - key: SYLN_PATH_PLAY
        value: ""                # empty = stream links come from the episode list
