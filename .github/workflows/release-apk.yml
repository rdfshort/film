# Builds a SIGNED release APK and publishes it on the repo's Releases page.
# Needs 2 repository secrets: ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD (see make-signing-key.yml).
# Run: GitHub repo -> Actions -> "Release signed APK" -> Run workflow.
name: Release signed APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "Build number: a whole number that goes UP with every release (1, 2, 3...)"
        required: true
        default: "1"
      api_url:
        description: "Your Render URL (no trailing slash)"
        required: true
        default: "https://reeldramafilm.onrender.com"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files for the app
        run: |
          rm -rf mobile/www && mkdir -p mobile/www
          cp -r web/. mobile/www/
          echo "window.VUTA_API = '${{ github.event.inputs.api_url }}';" > mobile/www/config.js

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Firebase (phone notifications)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > mobile/android/app/google-services.json; echo "Firebase config added"; else echo "No GOOGLE_SERVICES_JSON secret: building without phone push"; fi
          M=mobile/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n    </application>#' $M

      - name: Add Start.io ads plugin
        run: |
          D=mobile/android/app/src/main/java/com/reeldramafilm/app
          mkdir -p $D
          cp mobile/native/StartIoPlugin.java mobile/native/MainActivity.java $D/
          G=mobile/android/app/build.gradle
          sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.startapp:inapp-sdk:5.+'/" $G
          sed -i "s#inapp-sdk:5.+#inapp-sdk:5.5.2#" $G
          # Start.io 5.5.2 declares compileSdk 36; this project compiles against 34, so skip that build-time metadata check
          printf '\ntasks.configureEach { t -> if (t.name.endsWith("AarMetadata")) { t.enabled = false } }\n' >> $G
          grep -n "inapp-sdk" $G
          tail -3 $G

      - name: Add AdMob app id
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          M=mobile/android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\" />\n    </application>#" $M
          grep -c APPLICATION_ID $M

      - name: Allow Google sign-in to return to the app
        run: |
          python3 - <<'PY'
          p = 'mobile/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.reeldramafilm.app" android:host="auth-callback" />
              </intent-filter>
          '''
          if 'auth-callback' not in s:
              s = s.replace('</activity>', f + '</activity>', 1)
          open(p, 'w').write(s)
          PY

      - name: Apply the app logo
        run: |
          RES=mobile/android/app/src/main/res
          cp -r mobile/icons/res/. $RES/
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          for n in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
          done

      - name: Set version
        working-directory: mobile/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.version }}\"/" build.gradle
          grep -nE "versionCode|versionName" build.gradle

      - name: Build unsigned release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS" || { echo "Missing signing secrets"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias reeldrama \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out ReelDrama.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ReelDrama.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            "ReelDrama.apk" \
            --title "ReelDrama ${{ github.event.inputs.version }}" \
            --notes "Signed Android build ${{ github.event.inputs.version }}"
